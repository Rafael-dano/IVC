[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20.19.0"
  # treat VITE_* as public; omit them from scanning
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_BETA_FORM_EMAIL_ENTRY,VITE_BETA_FORM_URL,VITE_API_BASE"

# SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
