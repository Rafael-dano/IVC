name: healthcheck
on:
  schedule:
    - cron: "*/30 * * * *"  # every 30 min
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API /health
        run: |
          set -e
          curl -fsSL https://api.ivcontent.com/health | grep -qi "ok"
      - name: Ping Frontend
        run: |
          set -e
          curl -fsSIL https://ivcontent.com/ | grep -q "200"
