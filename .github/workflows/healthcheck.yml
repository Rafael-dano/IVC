name: healthcheck

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:         # allow manual run from Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit frontend (HEAD)
        run: |
          curl -I -f --retry 2 --retry-all-errors --max-time 15 https://ivcontent.com > /dev/null
      - name: Hit backend /health (expects ok:true)
        run: |
          curl -fsS --retry 2 --retry-all-errors --max-time 15 https://api.ivcontent.com/health | grep -q '"ok":true'
      - name: Hit LTD spots (basic JSON check)
        run: |
          curl -fsS --retry 2 --retry-all-errors --max-time 15 https://api.ivcontent.com/api/ltd-spots | grep -q '"spots"'
