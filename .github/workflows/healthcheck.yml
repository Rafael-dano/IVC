name: healthcheck

on:
  schedule:
    - cron: "*/30 * * * *"  # every 30 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit frontend (HTTPS, follow redirects)
        run: |
          curl -fsSL --max-time 15 https://ivcontent.com >/dev/null

      - name: Hit sitemap (optional but nice)
        run: |
          curl -fsSL --max-time 15 https://ivcontent.com/sitemap.xml >/dev/null

      - name: Hit backend /health (expects {"ok":true})
        run: |
          curl -fsS --max-time 15 https://api.ivcontent.com/health | grep -q '"ok":true'
