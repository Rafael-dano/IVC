name: healthcheck

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:         # allow manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit frontend
        run: |
          curl -I --max-time 10 https://ivcontent.com || exit 1
      - name: Hit backend /health
        run: |
          curl -sS --max-time 10 https://api.ivcontent.com/health | grep -q '"ok":true'
